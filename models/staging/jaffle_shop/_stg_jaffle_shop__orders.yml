models:
  - name: stg_jaffle_shop__orders
    description: one order per row 
    columns:
      - name: order_id
        description: primary key for the orders table
        data_tests:
          - unique
          - not_null
      - name: order_status
        description: "{{doc('order_status') }}"
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - completed
                  - shipped
                  - placed
                  - return_pending
      - name: customer_id
        data_tests:
          - relationships:
              field: customer_id
              to: ref('stg_jaffle_shop__customers')
      - name: order_date
        data_tests:
          - not_null
      - name: _etl_loaded_at
        data_tests:
          - not_null
